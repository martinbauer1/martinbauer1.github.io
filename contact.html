<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archangel Home Care Marketing | Contact Us</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar">
  <div class="logo">Archangel Home Care Marketing</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="solutions/website-design.html">Solutions</a></li>
    <li><a href="contact.html" class="active">Contact Us</a></li>
  </ul>
</nav>

<section class="contact-section">
  <div class="container">
    <h1>Contact Us</h1>
    <p>Fill out the form below and we’ll get back to you quickly.</p>
    <form id="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>
      <button type="submit" class="btn primary">Send Message</button>
    </form>
    <p id="form-status"></p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  (function(){emailjs.init("YOUR_USER_ID");})();
  const form=document.getElementById('contact-form');
  form.addEventListener('submit',function(event){
    event.preventDefault();
    emailjs.sendForm('YOUR_SERVICE_ID','YOUR_TEMPLATE_ID',this)
      .then(()=>{document.getElementById('form-status').innerText='Message sent successfully!'; form.reset();},
            (error)=>{document.getElementById('form-status').innerText='Failed to send message. Please try again.';});
  });
</script>

</body>
</html>
